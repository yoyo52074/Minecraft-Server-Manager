name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pyinstaller

      - name: Build EXE
        shell: pwsh
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Minecraft-Server-Manager
          --icon my_logo.ico
          --add-binary "playit.exe;."
          --collect-all ttkbootstrap
          --collect-all uvicorn
          --collect-all fastapi
          --collect-all argon2
          --add-data "web_panel/templates;web_panel/templates"
          --hidden-import requests
          --hidden-import multipart
          main.py

      - name: Verify EXE
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Minecraft-Server-Manager.exe")) {
            throw "EXE build output was not created"
          }
          Get-Item "dist/Minecraft-Server-Manager.exe" | Format-List Name,Length,FullName

      - name: Run EXE smoke test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist/Minecraft-Server-Manager.exe" -WorkingDirectory "dist" -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8765/login" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content -match "建立第一位管理員") {
                  $ready = $true
                  break
                }
              } catch {
                # The desktop application may still be initializing.
              }
            }
            if (-not $ready) {
              throw "EXE started but Web panel did not respond on http://127.0.0.1:8765/login"
            }
            Write-Host "EXE smoke test passed: Web panel responded on port 8765"
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Server-Manager-windows
          path: dist/Minecraft-Server-Manager.exe
          if-no-files-found: error

      - name: Attach EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Minecraft-Server-Manager.exe
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          generate_release_notes: true
