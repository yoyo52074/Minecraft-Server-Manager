{% extends 'base.html' %}{% block title %}{{ profile.name }}｜玩家管理{% endblock %}{% block content %}<main class="wrap"><p><a href="/server/{{ profile.id }}">← 返回伺服器</a></p><h1>{{ profile.name }}｜玩家管理</h1><section class="card"><button onclick="refresh()">重新取得線上玩家</button><table class="table"><thead><tr><th>玩家</th><th>操作</th></tr></thead><tbody id="players">{% for p in players %}<tr><td>{{ p.name }}</td><td><button onclick="act('kick','{{ p.name }}')">踢出</button><button class="danger" onclick="act('ban','{{ p.name }}')">封鎖</button><button class="secondary" onclick="act('op','{{ p.name }}')">OP</button></td></tr>{% else %}<tr><td colspan="2">目前沒有解析到線上玩家，請先在主控台執行 list。</td></tr>{% endfor %}</tbody></table><p id="msg" class="muted"></p></section></main><script>const id={{ profile.id }},csrf={{ csrf|tojson }};async function refresh(){const d=await(await fetch('/api/servers/'+id+'/players')).json();document.getElementById('players').innerHTML=(d.players||[]).map(p=>`<tr><td>${p.name}</td><td><button onclick="act('kick','${p.name}')">踢出</button><button class="danger" onclick="act('ban','${p.name}')">封鎖</button><button class="secondary" onclick="act('op','${p.name}')">OP</button></td></tr>`).join('')||'<tr><td colspan="2">目前沒有線上玩家</td></tr>'}async function act(action,player){if(!confirm('確定對 '+player+' 執行 '+action+'？'))return;const r=await fetch('/api/servers/'+id+'/players/'+action,{method:'POST',headers:{'content-type':'application/json','x-csrf-token':csrf},body:JSON.stringify({player})});const d=await r.json();document.getElementById('msg').textContent=d.message||d.detail||'';refresh()}</script>{% endblock %}
