{% extends 'base.html' %}{% block title %}{{ profile.name }}｜伺服器設定{% endblock %}{% block content %}<main class="wrap"><p><a href="/server/{{ profile.id }}">← 返回伺服器管理</a></p><h1>{{ profile.name }}｜伺服器設定</h1><p class="muted">儲存後需要重新啟動伺服器的項目會在下一次啟動時生效。</p><form id="settings-form" class="card"><h2>基本設定</h2><div class="grid"><div><label>MOTD</label><input name="motd" value="{{ properties.get('motd','') }}"><label>遊戲模式</label><select name="gamemode"><option value="survival">生存</option><option value="creative">創造</option><option value="adventure">冒險</option><option value="spectator">旁觀</option></select><label>難度</label><select name="difficulty"><option>peaceful</option><option>easy</option><option>normal</option><option>hard</option></select><label>最大玩家數</label><input name="max-players" type="number" min="1" value="{{ properties.get('max-players','20') }}"></div><div><label>伺服器連接埠</label><input name="server-port" type="number" min="1" max="65535" value="{{ properties.get('server-port', profile.server_port) }}"><label>正版驗證</label><select name="online-mode"><option value="true">開啟</option><option value="false">關閉</option></select><label>PVP</label><select name="pvp"><option value="true">開啟</option><option value="false">關閉</option></select><label>白名單</label><select name="white-list"><option value="true">開啟</option><option value="false">關閉</option></select></div></div><h2>Java 與啟動</h2><div class="grid"><div><label>Java 路徑</label><input name="java_path" value="{{ profile.java_path }}"><label>最小記憶體 MB</label><input name="min_memory" type="number" min="256" value="{{ profile.min_memory }}"></div><div><label>最大記憶體 MB</label><input name="max_memory" type="number" min="512" value="{{ profile.max_memory }}"><label>啟動檔案</label><input name="launcher" value="{{ profile.launcher }}" placeholder="server.jar 或 fabric-server-launch.jar"></div></div><label>進階 server.properties（每行 key=value）</label><textarea id="advanced">{% for key,value in properties.items() %}{{ key }}={{ value }}
{% endfor %}</textarea><div class="actions"><button type="submit">儲存設定</button><a class="button secondary" href="/server/{{ profile.id }}">取消</a></div><p id="result" class="muted"></p></form></main><script>const id={{ profile.id }},csrf={{ csrf|tojson }};const form=document.getElementById('settings-form');form.onsubmit=async e=>{e.preventDefault();const properties={};for(const line of document.getElementById('advanced').value.split('\n')){const index=line.indexOf('=');if(index>0)properties[line.slice(0,index).trim()]=line.slice(index+1).trim()}for(const name of ['motd','gamemode','difficulty','max-players','server-port','online-mode','pvp','white-list']){const el=form.elements[name];if(el)properties[name]=el.value}const payload={properties,profile:{java_path:form.elements.java_path.value,min_memory:Number(form.elements.min_memory.value),max_memory:Number(form.elements.max_memory.value),launcher:form.elements.launcher.value}};const r=await fetch('/api/servers/'+id+'/settings',{method:'PUT',headers:{'content-type':'application/json','x-csrf-token':csrf},body:JSON.stringify(payload)});const d=await r.json();document.getElementById('result').textContent=r.ok?'設定已儲存，必要時請重啟伺服器':(d.detail||'儲存失敗');if(r.ok){const advanced=Object.entries(d.properties||properties).map(([k,v])=>k+'='+v).join('\n');document.getElementById('advanced').value=advanced}}</script>{% endblock %}
