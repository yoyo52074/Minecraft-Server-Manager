{% extends 'base.html' %}
{% block title %}{{ profile.name }}｜操作歷史{% endblock %}
{% block content %}<main class="wrap"><p><a href="/server/{{ profile.id }}">← 返回伺服器</a></p><h1>{{ profile.name }}｜操作歷史</h1>
<section class="card"><h2>玩家及伺服器操作</h2><table class="table"><thead><tr><th>時間</th><th>使用者</th><th>動作</th><th>詳細資料</th></tr></thead><tbody id="operations"><tr><td colspan="4">載入中…</td></tr></tbody></table></section>
<section class="card" style="margin-top:16px"><h2>排程執行紀錄</h2><table class="table"><thead><tr><th>開始時間</th><th>排程</th><th>動作</th><th>結果</th><th>細節</th></tr></thead><tbody id="runs"><tr><td colspan="5">載入中…</td></tr></tbody></table></section></main>
<script>const id={{ profile.id }};function cell(row,value){const td=document.createElement('td');td.textContent=value??'';row.appendChild(td);return td}function date(value){if(!value)return '';const n=Number(value);return new Date(n>1e12?n:n*1000).toLocaleString()}
(async()=>{const r=await fetch(`/api/servers/${id}/history`),d=await r.json();const ops=document.getElementById('operations');ops.replaceChildren();for(const x of d.operations||[]){const tr=document.createElement('tr');cell(tr,x.created_at);cell(tr,x.username||'系統');cell(tr,x.action);cell(tr,x.detail);ops.appendChild(tr)}if(!ops.children.length){const tr=document.createElement('tr');cell(tr,'目前沒有操作紀錄').colSpan=4;ops.appendChild(tr)}const runs=document.getElementById('runs');runs.replaceChildren();for(const x of d.schedule_runs||[]){const tr=document.createElement('tr');cell(tr,date(x.started_at));cell(tr,x.schedule_name||'已刪除的排程');cell(tr,x.action);cell(tr,x.result);cell(tr,x.detail);runs.appendChild(tr)}if(!runs.children.length){const tr=document.createElement('tr');cell(tr,'目前沒有排程執行紀錄').colSpan=5;runs.appendChild(tr)}})();</script>{% endblock %}
