{% extends 'base.html' %}{% block title %}{{ profile.name }}｜備份中心{% endblock %}{% block content %}<main class="wrap"><p><a href="/server/{{ profile.id }}">← 返回伺服器</a></p><h1>{{ profile.name }}｜備份中心</h1><section class="card"><form id="create"><input id="label" placeholder="備份名稱" value="manual"><button>立即建立備份</button></form><table class="table"><thead><tr><th>檔名</th><th>大小</th><th>建立時間</th><th>操作</th></tr></thead><tbody id="backups">{% for b in backups %}<tr><td>{{ b.name }}</td><td>{{ b.size }} bytes</td><td>{{ b.modified_at }}</td><td><a class="button secondary" href="/api/servers/{{ profile.id }}/backups/{{ b.name }}/download">下載</a><button class="danger" onclick="removeBackup('{{ b.name }}')">刪除</button><button onclick="restore('{{ b.name }}')">還原</button></td></tr>{% else %}<tr><td colspan="4">尚未建立備份</td></tr>{% endfor %}</tbody></table><p id="msg" class="muted"></p></section></main><script>const id={{ profile.id }},csrf={{ csrf|tojson }},h={'content-type':'application/json','x-csrf-token':csrf};document.getElementById('create').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/servers/'+id+'/backups',{method:'POST',headers:h,body:JSON.stringify({label:document.getElementById('label').value})});const d=await r.json();document.getElementById('msg').textContent=d.message||d.detail||'備份已建立';if(r.ok)location.reload()};async function removeBackup(name){if(confirm('確定刪除備份？')){await fetch('/api/servers/'+id+'/backups/'+encodeURIComponent(name),{method:'DELETE',headers:h});location.reload()}}async function restore(name){if(confirm('還原前請確認伺服器已停止，確定繼續？')){const r=await fetch('/api/servers/'+id+'/backups/restore',{method:'POST',headers:h,body:JSON.stringify({name})});const d=await r.json();document.getElementById('msg').textContent=d.message||d.detail||'還原完成'}}</script>{% endblock %}
