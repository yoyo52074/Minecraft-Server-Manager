<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Minecraft Server Manager{% endblock %}</title>
  <style>
    :root{color-scheme:dark;--bg:#101419;--card:#1b222b;--border:#303b48;--text:#f5f7fa;--muted:#9ba8b6;--accent:#42a5f5;--green:#4caf50;--red:#ef5350;}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Microsoft JhengHei",sans-serif}a{color:var(--accent);text-decoration:none}.nav{display:flex;align-items:center;gap:18px;padding:16px 24px;background:#161c23;border-bottom:1px solid var(--border)}.brand{font-weight:700;margin-right:auto}.wrap{max-width:1100px;margin:28px auto;padding:0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}.muted{color:var(--muted)}.status{font-size:24px;font-weight:700}.online{color:var(--green)}.offline{color:var(--red)}button,.button{border:0;border-radius:8px;padding:10px 15px;background:var(--accent);color:white;cursor:pointer;font-weight:700}button.danger{background:var(--red)}button.secondary{background:#344150}input,select{width:100%;padding:10px;border:1px solid var(--border);border-radius:7px;background:#11171d;color:var(--text);margin:6px 0 14px}label{display:block;color:var(--muted)}pre{background:#0a0e12;border:1px solid var(--border);border-radius:8px;padding:14px;min-height:260px;max-height:480px;overflow:auto;white-space:pre-wrap}.actions{display:flex;flex-wrap:wrap;gap:10px}.error{color:#ff8a80;margin:10px 0}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid var(--border)}.login{max-width:430px;margin:10vh auto}.inline{display:inline}.small{font-size:13px}
  </style>
</head><body>
{% if user %}<nav class="nav"><div class="brand">Minecraft Server Manager</div><a href="/">總覽</a>{% if user.role == 'admin' %}<a href="/admin/users">帳號管理</a>{% endif %}<form class="inline" method="post" action="/logout"><button class="secondary">登出（{{ user.username }}）</button></form></nav>{% endif %}
{% block content %}{% endblock %}
</body></html>
