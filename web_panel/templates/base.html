<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Minecraft Server Manager{% endblock %}</title>
  <style>
    :root{color-scheme:dark;--bg:#101419;--card:#1b222b;--border:#303b48;--text:#f5f7fa;--muted:#9ba8b6;--accent:#42a5f5;--green:#4caf50;--red:#ef5350;}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Microsoft JhengHei",sans-serif}a{color:var(--accent);text-decoration:none}.nav{display:flex;align-items:center;gap:18px;padding:16px 24px;background:#161c23;border-bottom:1px solid var(--border)}.brand{font-weight:700;margin-right:auto}.wrap{max-width:1180px;margin:28px auto;padding:0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}.metric-card{min-height:220px}.metric-card canvas{width:100%;height:130px;background:#151925;border-radius:8px;margin-top:8px}.metric-value{font-size:24px;font-weight:700}.metric-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.muted{color:var(--muted)}.status{font-size:24px;font-weight:700}.online{color:var(--green)}.offline{color:var(--red)}button,.button{border:0;border-radius:8px;padding:10px 15px;background:var(--accent);color:white;cursor:pointer;font-weight:700}button.danger{background:var(--red)}button.secondary{background:#344150}input,select,textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:7px;background:#11171d;color:var(--text);margin:6px 0 14px}textarea{min-height:360px;font-family:monospace}label{display:block;color:var(--muted)}pre{background:#0a0e12;border:1px solid var(--border);border-radius:8px;padding:14px;min-height:260px;max-height:480px;overflow:auto;white-space:pre-wrap}.actions{display:flex;flex-wrap:wrap;gap:10px}.error{color:#ff8a80;margin:10px 0}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid var(--border)}.login{max-width:430px;margin:10vh auto}.inline{display:inline}.small{font-size:13px}.dropzone{border:2px dashed var(--border);border-radius:10px;padding:18px;text-align:center;margin:12px 0}.progress{height:8px;background:#0a0e12;border-radius:5px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--accent);width:0}
    .nav{flex-wrap:wrap}.nav-links{display:flex;align-items:center;gap:18px;margin-left:auto;flex-wrap:wrap}.nav a{white-space:nowrap}@media(max-width:820px){.nav{gap:10px;padding:12px 16px}.nav-links{gap:12px;margin-left:0}.brand{width:100%}}
    html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}body{overflow-x:hidden;line-height:1.5}button,.button{min-height:42px;font-size:15px}img,canvas,video{max-width:100%}.wrap{width:100%;min-width:0}.grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}.card{min-width:0;overflow-wrap:anywhere}.table{display:block;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap}.table th,.table td{vertical-align:middle}.nav-links{min-width:0}.nav form{flex:0 0 auto}input,select,textarea{min-width:0}pre{overflow-wrap:anywhere;word-break:break-word}
    @media(max-width:640px){.nav{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:10px 12px}.brand{width:auto;margin-right:0;font-size:15px}.nav-links{grid-column:1/-1;width:100%;margin:0;gap:8px;flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;padding:2px 0 8px}.nav-links a{flex:0 0 auto;padding:5px 2px;font-size:14px}.nav form{grid-column:2;grid-row:1}.nav form button{min-height:38px;padding:7px 10px;font-size:13px}.wrap{margin:16px auto;padding:0 12px}.wrap h1{font-size:clamp(1.45rem,7vw,1.9rem);line-height:1.2;overflow-wrap:anywhere}.grid,.player-grid,.schedule-grid,.user-edit-grid{grid-template-columns:minmax(0,1fr);gap:12px}.card{padding:15px;border-radius:10px}.metric-card{min-height:0}.metric-meta{gap:8px;flex-wrap:wrap}.metric-meta span{min-width:0}.actions{gap:8px}.actions button,.actions .button{min-height:44px}.table th,.table td{padding:8px;font-size:14px}input,select,textarea{font-size:16px}textarea{min-height:240px}pre{min-height:190px;max-height:55vh;padding:10px;font-size:12px}.dropzone{padding:14px}.login{width:calc(100% - 24px);margin:8vh auto}.wrap>section.card+section.card{margin-top:12px!important}.file-toolbar{align-items:stretch}.file-toolbar>label{flex:1 1 100%;min-width:0}.file-toolbar>button{flex:1 1 auto}.searchbar{align-items:stretch}.searchbar input{flex:1 1 100%;max-width:none}.permission-toolbar{align-items:stretch}.permission-toolbar button{flex:1 1 calc(50% - 8px)}.weekdays{gap:10px}.schedule-actions button{min-height:42px}.list-box{max-width:100%}.table{scrollbar-width:thin;scrollbar-color:var(--muted) var(--card)}}
    .console-form{display:flex;align-items:center;gap:8px}.console-form #command{width:auto;min-width:0;flex:1;margin:6px 0 10px}.console-form button{flex:0 0 auto}
    @media(max-width:640px){.nav-links{flex-wrap:wrap;overflow:visible;justify-content:flex-start}.nav-links a{flex:0 0 auto}}
    @media(max-width:380px){.wrap{padding:0 9px}.card{padding:12px}.nav{padding:9px}.nav-links{gap:6px}.nav-links a{font-size:13px}.button,button{padding:9px 11px}}
  </style>
</head><body>
{% if user %}<nav class="nav"><div class="brand">Minecraft Server Manager</div><div class="nav-links"><a href="/">總覽</a>{% if profile %}<a href="/server/{{ profile.id }}/files">檔案管理</a><a href="/server/{{ profile.id }}/backups">備份中心</a><a href="/server/{{ profile.id }}/players">玩家管理</a><a href="/server/{{ profile.id }}/schedules">排程</a><a href="/server/{{ profile.id }}/settings">伺服器設定</a><a href="/server/{{ profile.id }}/history">操作歷史</a><a href="/server/{{ profile.id }}/monitor">監控與告警</a>{% endif %}{% if user.role == 'admin' %}<a href="/admin/users">帳號管理</a>{% endif %}</div><form class="inline" method="post" action="/logout"><button class="secondary">登出（{{ user.username }}）</button></form></nav>{% endif %}
{% block content %}{% endblock %}
</body></html>
