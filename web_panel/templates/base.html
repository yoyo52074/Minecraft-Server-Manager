<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1118">
  <title>{% block title %}Minecraft Server Manager{% endblock %}</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1118;
      --surface: #121b25;
      --card: #141e29;
      --surface-raised: #192634;
      --surface-hover: #202f3e;
      --border: #293a4a;
      --border-strong: #3a5064;
      --text: #edf4fa;
      --muted: #9babb9;
      --accent: #63c8ed;
      --accent-strong: #3ab4e1;
      --accent-soft: rgba(72, 183, 221, .13);
      --green: #5bd69b;
      --green-soft: rgba(61, 190, 128, .12);
      --red: #ff7d87;
      --red-soft: rgba(245, 89, 105, .12);
      --amber: #f4c06b;
      --amber-soft: rgba(239, 177, 68, .12);
      --shadow: 0 14px 36px rgba(0, 0, 0, .22);
      --radius: 15px;
      --focus: 0 0 0 3px rgba(99, 200, 237, .22);
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--text);
      background: radial-gradient(1000px 560px at 15% -12%, rgba(42, 113, 150, .16), transparent 62%), var(--bg);
      font-family: system-ui, -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.55;
    }
    img, canvas, video { max-width: 100%; }
    a { color: var(--accent); text-decoration: none; transition: color .16s ease, background .16s ease; }
    a:hover { color: #a6e4fa; }
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible,
    textarea:focus-visible, summary:focus-visible { outline: none; box-shadow: var(--focus); }

    h1, h2, h3, h4 { color: var(--text); line-height: 1.25; letter-spacing: -.025em; }
    h1 { margin: 0 0 12px; font-size: clamp(1.65rem, 3.5vw, 2.25rem); font-weight: 750; }
    h2 { margin: 0 0 14px; font-size: 1.2rem; font-weight: 700; }
    h3 { margin: 18px 0 10px; font-size: 1rem; font-weight: 700; }
    p { margin: 8px 0 14px; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .error { color: #ff9aa1; margin: 10px 0; }

    .nav {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 66px;
      padding: 10px clamp(14px, 3vw, 34px);
      background: rgba(14, 21, 29, .94);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 8px 28px rgba(0, 0, 0, .14);
      backdrop-filter: blur(16px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
      margin-right: 4px;
      color: var(--text);
      font-size: 14px;
      font-weight: 750;
      letter-spacing: -.015em;
      white-space: nowrap;
    }
    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid rgba(145, 227, 237, .38);
      border-radius: 11px;
      color: #08202a;
      background: linear-gradient(135deg, #86e0be, #55bee8);
      box-shadow: 0 5px 18px rgba(62, 179, 206, .18);
      font-size: 16px;
      font-weight: 900;
    }
    .brand-copy { display: grid; line-height: 1.15; }
    .brand-copy small { margin-top: 3px; color: var(--muted); font-size: 9px; font-weight: 700; letter-spacing: .13em; }
    .nav-links {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 3px;
      min-width: 0;
      margin-left: auto;
    }
    .nav-links a {
      padding: 8px 10px;
      border: 1px solid transparent;
      border-radius: 9px;
      color: #b4c1cc;
      font-size: 13px;
      font-weight: 620;
      white-space: nowrap;
    }
    .nav-links a:hover, .nav-links a.is-active {
      border-color: var(--border);
      color: var(--text);
      background: var(--surface-raised);
    }
    .nav-links a.is-active { box-shadow: inset 0 -2px 0 var(--accent); }
    .nav form { flex: 0 0 auto; margin: 0; }
    .nav form button { min-height: 38px; padding: 7px 11px; font-size: 12px; }

    .wrap { width: min(100% - 36px, 1280px); min-width: 0; margin: 30px auto 48px; }
    .wrap > p:first-child { margin-top: 0; }
    .wrap > p:first-child a { color: var(--muted); font-size: 13px; font-weight: 600; }
    .wrap > p:first-child a:hover { color: var(--accent); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr)); gap: 16px; }
    .wrap > .grid:first-of-type { align-items: start; }
    .card {
      min-width: 0;
      padding: 21px;
      overflow-wrap: anywhere;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: linear-gradient(150deg, rgba(25, 38, 52, .96), rgba(18, 27, 37, .98));
      box-shadow: var(--shadow);
    }
    .server-entry { transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease; }
    .server-entry:hover { transform: translateY(-2px); border-color: var(--border-strong); box-shadow: 0 18px 40px rgba(0, 0, 0, .3); }
    .metric-card { min-height: 220px; }
    .metric-card canvas { width: 100%; height: 130px; margin-top: 8px; border-radius: 10px; background: #101923; }
    .metric-value { color: var(--text); font-size: clamp(24px, 3vw, 32px); font-weight: 760; letter-spacing: -.03em; }
    .metric-meta { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 13px; }

    button, .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 42px;
      padding: 9px 15px;
      border: 1px solid transparent;
      border-radius: 10px;
      color: #071821;
      background: linear-gradient(135deg, #72d2ef, #57b9e9);
      box-shadow: 0 5px 16px rgba(51, 164, 207, .12);
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 720;
      line-height: 1.2;
      text-align: center;
      text-decoration: none;
      transition: transform .14s ease, filter .14s ease, background .14s ease, border-color .14s ease;
    }
    button:hover, .button:hover { transform: translateY(-1px); filter: brightness(1.06); color: #06151e; }
    button:active, .button:active { transform: translateY(0); }
    button.secondary, .button.secondary {
      border-color: var(--border-strong);
      color: #d7e1e9;
      background: var(--surface-hover);
      box-shadow: none;
    }
    button.secondary:hover, .button.secondary:hover { border-color: #59718a; color: #fff; background: #293c4e; }
    button.danger, .button.danger {
      border-color: rgba(255, 125, 135, .28);
      color: #ff9aa1;
      background: var(--red-soft);
      box-shadow: none;
    }
    button.danger:hover, .button.danger:hover { border-color: rgba(255, 125, 135, .5); color: #ffd9dc; background: rgba(245, 89, 105, .2); }
    button:disabled, .button:disabled { transform: none; filter: none; opacity: .48; cursor: not-allowed; box-shadow: none; }
    button:disabled:hover { transform: none; }
    .actions { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }
    .inline { display: inline; }

    label { display: block; color: #c4d0d9; font-size: 13px; font-weight: 630; }
    input, select, textarea {
      width: 100%;
      min-width: 0;
      min-height: 43px;
      margin: 7px 0 15px;
      padding: 10px 12px;
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      color: var(--text);
      background: #0e1720;
      font: inherit;
      font-size: 15px;
      transition: border-color .14s ease, box-shadow .14s ease, background .14s ease;
    }
    input:hover, select:hover, textarea:hover { border-color: #49637a; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent-strong); background: #101b26; }
    input[type="checkbox"], input[type="radio"] { width: auto; min-height: 0; margin: 0; accent-color: var(--accent-strong); }
    input[type="file"] { padding: 8px; }
    input::placeholder, textarea::placeholder { color: #75899a; }
    textarea { min-height: 300px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    select { cursor: pointer; }
    progress { width: 100%; height: 16px; accent-color: var(--accent-strong); }

    pre {
      min-height: 260px;
      max-height: 480px;
      padding: 16px;
      overflow: auto;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      border: 1px solid #253545;
      border-radius: 12px;
      color: #d8e6e2;
      background: #091018;
      font: 13px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace;
      scrollbar-color: #34495b #0a121a;
    }
    .console-form { display: flex; align-items: center; gap: 8px; }
    .console-form #command { flex: 1; width: auto; min-width: 0; margin: 6px 0 10px; }
    .console-form button { flex: 0 0 auto; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      color: var(--muted);
      background: var(--surface-raised);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
    }
    .status.online { border-color: rgba(91, 214, 155, .28); color: var(--green); background: var(--green-soft); }
    .status.offline { border-color: rgba(255, 125, 135, .28); color: var(--red); background: var(--red-soft); }
    .online { color: var(--green); }
    .offline { color: var(--red); }

    .table { display: block; width: 100%; max-width: 100%; overflow-x: auto; border-collapse: separate; border-spacing: 0; white-space: nowrap; -webkit-overflow-scrolling: touch; scrollbar-color: #40556a var(--surface); }
    .table th, .table td { padding: 11px 12px; border-bottom: 1px solid rgba(63, 83, 102, .48); text-align: left; vertical-align: middle; }
    .table th { color: #b8c7d3; background: rgba(10, 17, 25, .5); font-size: 12px; font-weight: 700; letter-spacing: .025em; }
    .table tbody tr { transition: background .12s ease; }
    .table tbody tr:hover { background: rgba(117, 156, 187, .07); }
    .table td { color: #d8e1e8; }
    .table td button { min-height: 34px; padding: 6px 9px; font-size: 12px; }
    .table-wrap, .file-table-wrap { max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }

    .dropzone { margin: 12px 0; padding: 18px; border: 1px dashed var(--border-strong); border-radius: 12px; background: rgba(17, 29, 41, .62); text-align: center; }
    .progress { height: 8px; overflow: hidden; border-radius: 999px; background: #09121b; }
    .progress > i { display: block; width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent-strong), #8edcb9); transition: width .2s ease; }
    .login { width: min(430px, calc(100% - 24px)); margin: 10vh auto; }
    .login.card { padding: clamp(20px, 5vw, 32px); }
    details { border-color: var(--border); }
    summary { color: #dce6ee; cursor: pointer; }
    code { padding: 2px 5px; border: 1px solid var(--border); border-radius: 5px; color: #b9e7f3; background: #0b151e; font-size: .92em; }
    [hidden] { display: none !important; }

    @media (max-width: 1040px) {
      .nav { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; }
      .brand { grid-column: 1; }
      .nav-links { grid-column: 1 / -1; grid-row: 2; justify-content: flex-start; flex-wrap: wrap; margin-left: 0; }
      .nav form { grid-column: 2; grid-row: 1; }
    }
    @media (max-width: 640px) {
      .nav { position: relative; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 8px; padding: 10px 12px; }
      .brand { gap: 8px; font-size: 13px; }
      .brand-mark { width: 31px; height: 31px; border-radius: 10px; }
      .brand-copy small { font-size: 8px; }
      .nav-links { flex-wrap: nowrap; overflow-x: auto; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; padding: 1px 0 6px; scrollbar-width: none; }
      .nav-links::-webkit-scrollbar { display: none; }
      .nav-links a { flex: 0 0 auto; padding: 7px 9px; font-size: 13px; }
      .nav form button { min-height: 36px; padding: 6px 9px; font-size: 11px; }
      .wrap { width: calc(100% - 24px); margin: 20px auto 36px; }
      .wrap h1 { font-size: clamp(1.5rem, 7vw, 1.9rem); line-height: 1.2; overflow-wrap: anywhere; }
      .grid, .player-grid, .schedule-grid, .user-edit-grid { grid-template-columns: minmax(0, 1fr); gap: 12px; }
      .card { padding: 16px; border-radius: 13px; }
      .metric-card { min-height: 0; }
      .metric-meta { flex-wrap: wrap; gap: 7px 12px; }
      .metric-meta span { min-width: 0; }
      .actions { gap: 8px; }
      .actions button, .actions .button { min-height: 44px; }
      .table th, .table td { padding: 9px 10px; font-size: 13px; }
      input, select, textarea { font-size: 16px; }
      textarea { min-height: 240px; }
      pre { min-height: 190px; max-height: 55vh; padding: 12px; font-size: 12px; }
      .dropzone { padding: 14px; }
      .login { margin: 8vh auto; }
      .wrap > section.card + section.card { margin-top: 14px !important; }
      .file-toolbar { align-items: stretch; }
      .file-toolbar > label { flex: 1 1 100%; min-width: 0; }
      .file-toolbar > button { flex: 1 1 auto; }
      .searchbar { align-items: stretch; }
      .searchbar input { flex: 1 1 100%; max-width: none; }
      .permission-toolbar { align-items: stretch; }
      .permission-toolbar button { flex: 1 1 calc(50% - 8px); }
      .weekdays { gap: 10px; }
      .schedule-actions button { min-height: 42px; }
      .list-box { max-width: 100%; }
    }
    @media (max-width: 380px) {
      .wrap { width: calc(100% - 18px); }
      .card { padding: 13px; }
      .nav { padding: 9px; }
      .nav-links { gap: 1px; }
      .nav-links a { padding: 6px 8px; font-size: 12px; }
      .button, button { padding: 9px 11px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
{% if user %}
<nav class="nav" aria-label="主導覽">
  <div class="brand" aria-label="Minecraft Server Manager">
    <span class="brand-mark" aria-hidden="true">M</span>
    <span class="brand-copy">Minecraft Server Manager<small>CONTROL PANEL</small></span>
  </div>
  <div class="nav-links">
    <a href="/">總覽</a>
    {% if profile %}
    <a href="/server/{{ profile.id }}">伺服器</a>
    <a href="/server/{{ profile.id }}/files">檔案管理</a>
    <a href="/server/{{ profile.id }}/backups">備份中心</a>
    <a href="/server/{{ profile.id }}/players">玩家管理</a>
    <a href="/server/{{ profile.id }}/schedules">排程</a>
    <a href="/server/{{ profile.id }}/settings">伺服器設定</a>
    <a href="/server/{{ profile.id }}/history">操作歷史</a>
    <a href="/server/{{ profile.id }}/monitor">監控與告警</a>
    {% endif %}
    {% if user.role == 'admin' %}<a href="/admin/users">帳號管理</a>{% endif %}
  </div>
  <form method="post" action="/logout">
    <input type="hidden" name="csrf" value="{{ user.csrf_token }}">
    <button class="secondary" type="submit">登出（{{ user.username }}）</button>
  </form>
</nav>
<script>
(() => {
  const path = window.location.pathname;
  document.querySelectorAll('.nav-links a').forEach((link) => {
    if (link.getAttribute('href') === path) {
      link.classList.add('is-active');
      link.setAttribute('aria-current', 'page');
    }
  });
})();
</script>
{% endif %}
{% block content %}{% endblock %}
</body>
</html>
