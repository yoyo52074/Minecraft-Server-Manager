{% extends 'base.html' %}{% block title %}伺服器總覽{% endblock %}{% block content %}<main class="wrap"><h1>伺服器總覽</h1><div class="grid"><section class="card"><div class="muted">目前狀態</div><div id="status" class="status {{ 'online' if status.running else 'offline' }}">{{ '● 運行中' if status.running else '● 已停止' }}</div><p class="muted">路徑：{{ status.server_directory }}</p><div class="actions"><button onclick="action('start')">啟動</button><button class="danger" onclick="action('stop')">停止</button><button class="secondary" onclick="action('restart')">重啟</button></div><p id="message" class="muted"></p></section><section class="card"><div class="muted">主控台指令</div><form onsubmit="sendCommand(event)"><input id="command" placeholder="例如：say 歡迎回來" maxlength="512"><button>發送指令</button></form><p class="small muted">只有管理員與操作者可以發送指令。</p></section></div><section class="card" style="margin-top:16px"><h2>即時主控台</h2><pre id="logs">{{ logs|join('\n') }}</pre></section></main><script>const csrf=document.cookie.split('; ').find(x=>x.startsWith('mcm_csrf='))?.split('=')[1]||'';async function action(name){const r=await fetch('/api/server/'+name,{method:'POST',headers:{'x-csrf-token':csrf}});const d=await r.json();document.getElementById('message').textContent=d.message;refresh()}async function sendCommand(e){e.preventDefault();const input=document.getElementById('command');const r=await fetch('/api/console',{method:'POST',headers:{'content-type':'application/json','x-csrf-token':csrf},body:JSON.stringify({command:input.value})});const d=await r.json();document.getElementById('message').textContent=d.message;input.value=''}async function refresh(){const s=await (await fetch('/api/status')).json();const el=document.getElementById('status');el.textContent=s.running?'● 運行中':'● 已停止';el.className='status '+(s.running?'online':'offline')}setInterval(refresh,3000);</script>{% endblock %}
